apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: vsw-models-hist-ssp3
  namespace: default
spec:
  arguments:
    parameters:
      - name: S3_KEY
        value: ""
      - name: S3_SECRET
        value: ""
      - name: DESP_USER
        value: ""
      - name: DESP_PASS
        value: ""
  entrypoint: run-vsw-models-hist-ssp3
  templates:
    - name: run-vsw-models-hist-ssp3
      container:
        name: main
        image: ghcr.io/koenifra/vsw-models-hist-ssp3:latest
        imagePullPolicy: Always
        command:
          - python
        args:
          - models_hist_ssp3.py
          - --desp-user
          - "{{workflow.parameters.DESP_USER}}"
          - --desp-password
          - "{{workflow.parameters.DESP_PASS}}"
          - --s3-key
          - "{{workflow.parameters.S3_KEY}}"
          - --s3-secret
          - "{{workflow.parameters.S3_SECRET}}"
  ttlStrategy:
    secondsAfterCompletion: 300
  podGC:
    strategy: OnPodCompletion
